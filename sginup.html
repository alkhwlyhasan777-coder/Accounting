<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sign Up</title>
        <!-- Styles -->
        <link rel="stylesheet" href="./css/sinup.css ">
        <link rel="stylesheet" href="./css/style.css">
        <!-- Bootstrap -->
        <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="./node_modules/bootstrap/dist/js/bootstrap.min.js">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    </head>
    <body>
        <div class="container-fluid">
            <div class="form-login">
                <form class="row g-3">
                    <div class="col-md-12">
                        <label for="" >Name</label>
                        <input type="text" class="form-control username" id="validationDefault01" value="" placeholder="name" required>
                    </div> 
                    <div class="mb-3 col-md-12">
                        <label for="inputPassword5" class="form-label">
                            Password
                        </label>
                        <div class="position-relative">
                            <input type="password" id="inputPassword5" class="form-control password"  placeholder="password">
                            <i id="togglePassword" class="bi bi-eye-fill"></i>
                        </div>
                        <div id="passwordHelpBlock" class="form-text">
                            
                        </div>
                    </div>
                    <div class="mb-3 col-md-12">
                        <label for="exampleInputEmail1" class="form-label">Email address</label>
                        <input type="email" placeholder="email" class="form-control email" id="exampleInputEmail1" aria-describedby="emailHelp"  required>
                        <div id="emailHelp" class="form-text email-text"></div>
                    </div>
                    <div class="col-md-12">
                        <label for="validationDefaultUsername" class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text" id="inputGroupPrepend2">@</span>
                            <input 
                            type="text" 
                            placeholder="username"
                            class="form-control" 
                            id="validationDefaultUsername" 
                            aria-describedby="inputGroupPrepend2" 
                            required>
                        </div>
                    </div>
                    <div class="col-md-12">
                        <label for="validationDefault03" class="form-label">City</label>
                        <input type="text" class="form-control" id="validationDefault03" required>
                    </div>
                    
                    <div class="col-12">
                        <button class="btn btn-primary add-acount" type="submit">Create Account</button>
                    </div>
                    <p class="signup-row"> You have an account (<a class="signup-link" href="./login.html">Log In</a>)</p>
                </form>
            </div>
        </div>
    </body>
    <script type="module" src="./js/sinup.js"></script>
</html>
